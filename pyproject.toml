[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-csv-analyst"
version = "0.1.0"
description = "MCP server for CSV analysis — stats, charts, and AI-powered insights"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Chenney Zhuang", email = "dev@example.com"}]
keywords = ["mcp", "csv", "data-analysis", "pandas", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.2",
    "csv-analyst @ git+https://github.com/ChenneyZhuang/csv-analyst-agent.git",
]

[project.scripts]
mcp-csv-analyst = "mcp_csv_analyst.server:main"

[tool.setuptools.packages.find]
where = ["src"]
